<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 648" width="980" height="648" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="flechaRuta" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b63ce"/>
    </marker>
    <marker id="flechaRegreso" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7684"/>
    </marker>
  </defs>

  <rect width="980" height="648" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="55" y="34" font-size="19" font-weight="600" fill="#1a1d21">
    Salas técnicas — recorrido de la ronda de verificación
  </text>
  <text x="55" y="58" font-size="13" fill="#5f6b76">
    Esquema representativo. Ronda de 5 puntos: 38 min de verificación + 10 min de traslados + 9 min de regreso.
  </text>

  <!-- ============ Pasillo tecnico ============ -->
  <rect x="55" y="270" width="865" height="80" rx="3" fill="#eef1f4" stroke="#c6ced6" stroke-width="1.5"/>
  <text x="905" y="296" font-size="12" fill="#8a949e" text-anchor="end">Pasillo técnico</text>

  <!-- ============ Antesala: punto seguro ============ -->
  <rect x="55" y="255" width="128" height="110" rx="4" fill="#e8f4ec" stroke="#4e9c6d" stroke-width="2"/>
  <text x="119" y="288" font-size="12.5" font-weight="600" fill="#2f6b48" text-anchor="middle">Antesala</text>
  <text x="119" y="306" font-size="11.5" fill="#3d7a56" text-anchor="middle">Punto seguro</text>
  <text x="119" y="323" font-size="11.5" fill="#3d7a56" text-anchor="middle">Base de carga</text>
  <text x="119" y="346" font-size="11" font-weight="600" fill="#2f6b48" text-anchor="middle">INICIO / FIN</text>

  <!-- ============ Salas sobre el pasillo ============ -->
  <!-- P1 -->
  <rect x="225" y="95" width="150" height="160" rx="4" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.8"/>
  <text x="300" y="134" font-size="12.5" font-weight="600" fill="#1a1d21" text-anchor="middle">Sala de</text>
  <text x="300" y="152" font-size="12.5" font-weight="600" fill="#1a1d21" text-anchor="middle">tablero general</text>
  <text x="300" y="177" font-size="11.5" fill="#5f6b76" text-anchor="middle">8 min</text>
  <text x="300" y="196" font-size="10.5" fill="#8a949e" text-anchor="middle">recinto blindado</text>

  <!-- P3 -->
  <rect x="475" y="95" width="150" height="160" rx="4" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.8"/>
  <text x="550" y="134" font-size="12.5" font-weight="600" fill="#1a1d21" text-anchor="middle">Sala de UPS</text>
  <text x="550" y="152" font-size="12.5" font-weight="600" fill="#1a1d21" text-anchor="middle">y racks</text>
  <text x="550" y="177" font-size="11.5" fill="#5f6b76" text-anchor="middle">7 min</text>

  <!-- P5 -->
  <rect x="725" y="95" width="150" height="160" rx="4" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.8"/>
  <text x="800" y="134" font-size="12.5" font-weight="600" fill="#1a1d21" text-anchor="middle">Grupo</text>
  <text x="800" y="152" font-size="12.5" font-weight="600" fill="#1a1d21" text-anchor="middle">electrógeno</text>
  <text x="800" y="177" font-size="11.5" fill="#5f6b76" text-anchor="middle">7 min</text>

  <!-- ============ Salas bajo el pasillo ============ -->
  <!-- P2 -->
  <rect x="350" y="365" width="150" height="160" rx="4" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.8"/>
  <text x="425" y="432" font-size="12.5" font-weight="600" fill="#1a1d21" text-anchor="middle">Sala de bombas</text>
  <text x="425" y="450" font-size="12.5" font-weight="600" fill="#1a1d21" text-anchor="middle">y presurización</text>
  <text x="425" y="475" font-size="11.5" fill="#5f6b76" text-anchor="middle">8 min</text>

  <!-- P4 -->
  <rect x="600" y="365" width="150" height="160" rx="4" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.8"/>
  <text x="675" y="432" font-size="12.5" font-weight="600" fill="#1a1d21" text-anchor="middle">Sala de máquinas</text>
  <text x="675" y="450" font-size="12.5" font-weight="600" fill="#1a1d21" text-anchor="middle">de ascensores</text>
  <text x="675" y="475" font-size="11.5" fill="#5f6b76" text-anchor="middle">8 min</text>

  <!-- ============ Regreso (se dibuja primero, queda por debajo) ============ -->
  <line x1="800" y1="332" x2="200" y2="332"
        stroke="#6b7684" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaRegreso)"/>

  <!-- ============ Recorrido de ida ============ -->
  <line x1="183" y1="300" x2="800" y2="300" stroke="#0b63ce" stroke-width="2.5"/>

  <!-- Entradas a las salas de arriba -->
  <line x1="300" y1="300" x2="300" y2="258" stroke="#0b63ce" stroke-width="2.5" marker-end="url(#flechaRuta)"/>
  <line x1="550" y1="300" x2="550" y2="258" stroke="#0b63ce" stroke-width="2.5" marker-end="url(#flechaRuta)"/>
  <line x1="800" y1="300" x2="800" y2="258" stroke="#0b63ce" stroke-width="2.5" marker-end="url(#flechaRuta)"/>

  <!-- Entradas a las salas de abajo: halo blanco para que el cruce con el
       regreso se lea como un salto y no como una conexion -->
  <line x1="425" y1="312" x2="425" y2="352" stroke="#ffffff" stroke-width="7"/>
  <line x1="675" y1="312" x2="675" y2="352" stroke="#ffffff" stroke-width="7"/>
  <line x1="425" y1="300" x2="425" y2="362" stroke="#0b63ce" stroke-width="2.5" marker-end="url(#flechaRuta)"/>
  <line x1="675" y1="300" x2="675" y2="362" stroke="#0b63ce" stroke-width="2.5" marker-end="url(#flechaRuta)"/>

  <!-- ============ Numeros de orden ============ -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="300" cy="230" r="14" fill="#0b63ce"/>
    <text x="300" y="235" fill="#ffffff">1</text>
    <circle cx="425" cy="392" r="14" fill="#0b63ce"/>
    <text x="425" y="397" fill="#ffffff">2</text>
    <circle cx="550" cy="230" r="14" fill="#0b63ce"/>
    <text x="550" y="235" fill="#ffffff">3</text>
    <circle cx="675" cy="392" r="14" fill="#0b63ce"/>
    <text x="675" y="397" fill="#ffffff">4</text>
    <circle cx="800" cy="230" r="14" fill="#0b63ce"/>
    <text x="800" y="235" fill="#ffffff">5</text>
  </g>

  <!-- ============ Oficina del operador ============ -->
  <rect x="55" y="498" width="235" height="82" rx="4" fill="#f4f0fa" stroke="#8a76c4" stroke-width="2"/>
  <text x="172" y="527" font-size="12.5" font-weight="600" fill="#4a3a7a" text-anchor="middle">
    Oficina de mantenimiento
  </text>
  <text x="172" y="546" font-size="11.5" fill="#5f4f8a" text-anchor="middle">Operador — supervisa la ronda</text>
  <text x="172" y="564" font-size="11.5" fill="#5f4f8a" text-anchor="middle">desde la aplicación</text>

  <line x1="215" y1="498" x2="215" y2="354"
        stroke="#8a76c4" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="228" y="420" font-size="11.5" fill="#5f4f8a">Enlace Wi-Fi</text>
  <text x="228" y="437" font-size="11.5" font-weight="600" fill="#5f4f8a">sin línea de vista</text>

  <!-- ============ Referencias ============ -->
  <g font-size="11.5" fill="#5f6b76">
    <line x1="470" y1="548" x2="510" y2="548" stroke="#0b63ce" stroke-width="2.5"
          marker-end="url(#flechaRuta)"/>
    <text x="522" y="552">Recorrido de la ronda — 48 min</text>

    <line x1="470" y1="574" x2="510" y2="574" stroke="#6b7684" stroke-width="2"
          stroke-dasharray="7 5" marker-end="url(#flechaRegreso)"/>
    <text x="522" y="578">Regreso al punto seguro — 9 min</text>

    <rect x="470" y="594" width="40" height="13" rx="2" fill="#e8f4ec" stroke="#4e9c6d" stroke-width="1.5"/>
    <text x="522" y="605">Punto seguro y base de carga</text>
  </g>

</svg>
