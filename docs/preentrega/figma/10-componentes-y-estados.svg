<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 848" width="1100" height="848" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="848" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="19" font-weight="700" fill="#1A1D21">Componentes reutilizables y sus cuatro estados visuales</text>
  <text x="40" y="68" font-size="12" fill="#6B7684">Cada componente se usa en las seis pantallas con el mismo criterio: el estado nunca se comunica sólo por color, siempre hay texto que lo dice.</text>

  <!-- Encabezados de columna -->
  <text x="200" y="104" font-size="11" font-weight="700" fill="#8A949E" letter-spacing="0.6">NORMAL</text>
  <text x="416" y="104" font-size="11" font-weight="700" fill="#8A949E" letter-spacing="0.6">DESHABILITADO</text>
  <text x="632" y="104" font-size="11" font-weight="700" fill="#8A949E" letter-spacing="0.6">ADVERTENCIA</text>
  <text x="848" y="104" font-size="11" font-weight="700" fill="#8A949E" letter-spacing="0.6">ERROR</text>
  <line x1="40" y1="112" x2="1060" y2="112" stroke="#E2E6EB" stroke-width="1"/>

  <!-- ================= 1. Boton de comando ================= -->
  <text x="40" y="146" font-size="12" font-weight="600" fill="#1A1D21">Botón de comando</text>
  <text x="40" y="164" font-size="10" fill="#8A949E">Dice por qué está</text>
  <text x="40" y="177" font-size="10" fill="#8A949E">deshabilitado</text>

  <rect x="200" y="124" width="184" height="58" rx="10" fill="#FFFFFF" stroke="#0B63CE" stroke-width="1.5"/>
  <text x="214" y="148" font-size="12" font-weight="600" fill="#0B63CE">Pausar misión</text>
  <text x="214" y="167" font-size="9.5" fill="#6B7684">El robot conserva el punto actual</text>

  <rect x="416" y="124" width="184" height="58" rx="10" fill="#F1F3F5"/>
  <text x="430" y="148" font-size="12" font-weight="600" fill="#AAB2BB">Iniciar misión</text>
  <text x="430" y="167" font-size="9.5" fill="#8A949E">Ya hay una ronda en curso</text>

  <rect x="632" y="124" width="184" height="58" rx="10" fill="#FFFFFF" stroke="#E6B566" stroke-width="1.5"/>
  <text x="646" y="148" font-size="12" font-weight="600" fill="#B26B00">Reanudar misión</text>
  <text x="646" y="167" font-size="9.5" fill="#B26B00">Presencia a 1,8 m sin cubrir</text>

  <rect x="848" y="124" width="184" height="58" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="862" y="148" font-size="12" font-weight="700" fill="#C0392B">Detención operativa</text>
  <text x="862" y="167" font-size="9.5" fill="#A5392B">Solicitud, no parada física</text>

  <line x1="40" y1="202" x2="1060" y2="202" stroke="#F0F2F5" stroke-width="1"/>

  <!-- ================= 2. Chip de estado de orden ================= -->
  <text x="40" y="238" font-size="12" font-weight="600" fill="#1A1D21">Chip de estado</text>
  <text x="40" y="254" font-size="12" font-weight="600" fill="#1A1D21">de orden</text>
  <text x="40" y="274" font-size="10" fill="#8A949E">Estado y ejecución</text>
  <text x="40" y="287" font-size="10" fill="#8A949E">son dos cosas</text>

  <rect x="200" y="222" width="94" height="22" rx="11" fill="#E8F4EC"/>
  <text x="247" y="237" font-size="10" font-weight="700" fill="#2F6B48" text-anchor="middle">CONFIRMADA</text>
  <text x="200" y="262" font-size="9.5" fill="#2F6B48">Ejecución verificada</text>
  <text x="200" y="278" font-size="9" fill="#8A949E">estado PAUSADO a los 1,5 s</text>

  <rect x="416" y="222" width="84" height="22" rx="11" fill="#EEF1F4"/>
  <text x="458" y="237" font-size="10" font-weight="700" fill="#6B7684" text-anchor="middle">PENDIENTE</text>
  <text x="416" y="262" font-size="9.5" fill="#8A949E">Esperando acuse</text>
  <text x="416" y="278" font-size="9" fill="#8A949E">vence a los 8 s</text>

  <rect x="632" y="222" width="110" height="22" rx="11" fill="#FFF4E0"/>
  <text x="687" y="237" font-size="10" font-weight="700" fill="#B26B00" text-anchor="middle">SIN RESPUESTA</text>
  <text x="632" y="262" font-size="9.5" fill="#B26B00">No se reintenta sola</text>
  <text x="632" y="278" font-size="9" fill="#8A949E">8 s sin acuse del robot</text>

  <rect x="848" y="222" width="94" height="22" rx="11" fill="#FDECEA"/>
  <text x="895" y="237" font-size="10" font-weight="700" fill="#C0392B" text-anchor="middle">CONFIRMADA</text>
  <text x="848" y="262" font-size="9.5" font-weight="700" fill="#C0392B">Ejecución NO verificada</text>
  <text x="848" y="278" font-size="9" fill="#A5392B">sigue a 1,2 m/s tras 5 s</text>

  <line x1="40" y1="306" x2="1060" y2="306" stroke="#F0F2F5" stroke-width="1"/>

  <!-- ================= 3. Tarjeta de telemetria ================= -->
  <text x="40" y="342" font-size="12" font-weight="600" fill="#1A1D21">Tarjeta de</text>
  <text x="40" y="358" font-size="12" font-weight="600" fill="#1A1D21">telemetría</text>
  <text x="40" y="378" font-size="10" fill="#8A949E">El borde punteado</text>
  <text x="40" y="391" font-size="10" fill="#8A949E">marca dato congelado</text>

  <rect x="200" y="326" width="184" height="76" rx="10" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"/>
  <text x="214" y="346" font-size="9" font-weight="600" fill="#8A949E" letter-spacing="0.5">TEMPERATURA MÁXIMA</text>
  <text x="214" y="372" font-size="17" font-weight="700" fill="#1A1D21">41,2 °C</text>
  <text x="214" y="390" font-size="9" fill="#6B7684">dentro del umbral</text>

  <rect x="416" y="326" width="184" height="76" rx="10" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"
        stroke-dasharray="5 4"/>
  <text x="430" y="346" font-size="9" font-weight="600" fill="#AAB2BB" letter-spacing="0.5">TEMPERATURA (CONGELADA)</text>
  <text x="430" y="372" font-size="17" font-weight="700" fill="#AAB2BB">38,5 °C</text>
  <text x="430" y="390" font-size="9" fill="#AAB2BB">valor de hace 47 s</text>

  <rect x="632" y="326" width="184" height="76" rx="10" fill="#FFFFFF" stroke="#E6B566" stroke-width="1.5"/>
  <rect x="632" y="326" width="5" height="76" rx="2.5" fill="#B26B00"/>
  <text x="648" y="346" font-size="9" font-weight="600" fill="#8A5200" letter-spacing="0.5">TEMPERATURA MÁXIMA</text>
  <text x="648" y="372" font-size="17" font-weight="700" fill="#B26B00">64,8 °C</text>
  <text x="648" y="390" font-size="9" fill="#B26B00">cerca del umbral de 70 °C</text>

  <rect x="848" y="326" width="184" height="76" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
  <text x="862" y="346" font-size="9" font-weight="600" fill="#A5392B" letter-spacing="0.5">TEMPERATURA MÁXIMA</text>
  <text x="862" y="372" font-size="17" font-weight="700" fill="#C0392B">78,4 °C</text>
  <text x="862" y="390" font-size="9" fill="#A5392B">sobre el umbral de 70 °C</text>

  <line x1="40" y1="422" x2="1060" y2="422" stroke="#F0F2F5" stroke-width="1"/>

  <!-- ================= 4. Banner de alerta ================= -->
  <text x="40" y="458" font-size="12" font-weight="600" fill="#1A1D21">Banner de alerta</text>
  <text x="40" y="478" font-size="10" fill="#8A949E">Reconocer no es</text>
  <text x="40" y="491" font-size="10" fill="#8A949E">resolver</text>

  <rect x="200" y="442" width="184" height="64" rx="10" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"/>
  <rect x="214" y="454" width="42" height="17" rx="8.5" fill="#EEF1F4"/>
  <text x="235" y="466" font-size="8.5" font-weight="700" fill="#6B7684" text-anchor="middle">INFO</text>
  <text x="214" y="488" font-size="11" fill="#1A1D21">Enlace restablecido</text>
  <text x="214" y="501" font-size="9" fill="#8A949E">sin reconocer</text>

  <rect x="416" y="442" width="184" height="64" rx="10" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"/>
  <rect x="430" y="454" width="76" height="17" rx="8.5" fill="#EEF1F4"/>
  <text x="468" y="466" font-size="8.5" font-weight="700" fill="#AAB2BB" text-anchor="middle">RECONOCIDA</text>
  <text x="430" y="488" font-size="11" fill="#AAB2BB">Enlace restablecido</text>
  <text x="430" y="501" font-size="9" fill="#8A949E">vista por el operador 14:31</text>

  <rect x="632" y="442" width="184" height="64" rx="10" fill="#FFF4E0" stroke="#E6B566" stroke-width="1.5"/>
  <rect x="646" y="454" width="84" height="17" rx="8.5" fill="#B26B00"/>
  <text x="688" y="466" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">ADVERTENCIA</text>
  <text x="646" y="488" font-size="11" font-weight="600" fill="#8A5200">Temperatura 78,4 °C en P1</text>
  <text x="646" y="501" font-size="9" fill="#B26B00">sin reconocer · hace 3 min</text>

  <rect x="848" y="442" width="184" height="64" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
  <rect x="862" y="454" width="56" height="17" rx="8.5" fill="#C0392B"/>
  <text x="890" y="466" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CRÍTICA</text>
  <text x="862" y="488" font-size="11" font-weight="700" fill="#1A1D21">La detención no se verificó</text>
  <text x="862" y="501" font-size="9" fill="#A5392B">intervención presencial</text>

  <line x1="40" y1="526" x2="1060" y2="526" stroke="#F0F2F5" stroke-width="1"/>

  <!-- ================= 5. Indicador de antiguedad ================= -->
  <text x="40" y="562" font-size="12" font-weight="600" fill="#1A1D21">Indicador de</text>
  <text x="40" y="578" font-size="12" font-weight="600" fill="#1A1D21">antigüedad del dato</text>
  <text x="40" y="598" font-size="10" fill="#8A949E">Nunca muestra un</text>
  <text x="40" y="611" font-size="10" fill="#8A949E">valor viejo como actual</text>

  <rect x="200" y="546" width="184" height="52" rx="10" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"/>
  <circle cx="216" cy="566" r="4" fill="#2F6B48"/>
  <text x="228" y="570" font-size="10.5" fill="#2F6B48">Dato actual</text>
  <text x="214" y="588" font-size="9" fill="#8A949E">actualizado hace 1 s</text>

  <rect x="416" y="546" width="184" height="52" rx="10" fill="#F1F3F5"/>
  <circle cx="432" cy="566" r="4" fill="#AAB2BB"/>
  <text x="444" y="570" font-size="10.5" fill="#8A949E">Sin robot seleccionado</text>
  <text x="430" y="588" font-size="9" fill="#AAB2BB">no hay telemetría</text>

  <rect x="632" y="546" width="184" height="52" rx="10" fill="#FFF4E0" stroke="#E6B566" stroke-width="1.5"/>
  <circle cx="648" cy="566" r="4" fill="#B26B00"/>
  <text x="660" y="570" font-size="10.5" font-weight="600" fill="#8A5200">Enlace degradado</text>
  <text x="646" y="588" font-size="9" fill="#B26B00">dato de hace 4 s</text>

  <rect x="848" y="546" width="184" height="52" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
  <circle cx="864" cy="566" r="4" fill="#C0392B"/>
  <text x="876" y="570" font-size="10.5" font-weight="700" fill="#C0392B">ENLACE PERDIDO</text>
  <text x="862" y="588" font-size="9" fill="#A5392B">dato de hace 47 s · congelado</text>

  <line x1="40" y1="618" x2="1060" y2="618" stroke="#F0F2F5" stroke-width="1"/>

  <!-- ================= 6. Barra de progreso ================= -->
  <text x="40" y="654" font-size="12" font-weight="600" fill="#1A1D21">Barra de progreso</text>
  <text x="40" y="670" font-size="12" font-weight="600" fill="#1A1D21">de ronda</text>
  <text x="40" y="690" font-size="10" fill="#8A949E">Una ronda incompleta</text>
  <text x="40" y="703" font-size="10" fill="#8A949E">bloquea a la cuadrilla</text>

  <rect x="200" y="638" width="184" height="62" rx="10" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"/>
  <rect x="214" y="658" width="156" height="8" rx="4" fill="#EEF1F4"/>
  <rect x="214" y="658" width="62" height="8" rx="4" fill="#0B63CE"/>
  <text x="214" y="686" font-size="10" fill="#6B7684">2 de 5 puntos · 40 %</text>

  <rect x="416" y="638" width="184" height="62" rx="10" fill="#F1F3F5"/>
  <rect x="430" y="658" width="156" height="8" rx="4" fill="#E2E6EB"/>
  <text x="430" y="686" font-size="10" fill="#AAB2BB">Sin ronda activa</text>

  <rect x="632" y="638" width="184" height="62" rx="10" fill="#FFF4E0" stroke="#E6B566" stroke-width="1.5"/>
  <rect x="646" y="658" width="156" height="8" rx="4" fill="#F2E2C4"/>
  <rect x="646" y="658" width="94" height="8" rx="4" fill="#B26B00"/>
  <text x="646" y="686" font-size="10" fill="#8A5200">3 de 5 · autonomía al límite</text>

  <rect x="848" y="638" width="184" height="62" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
  <rect x="862" y="658" width="156" height="8" rx="4" fill="#F5D2CC"/>
  <rect x="862" y="658" width="62" height="8" rx="4" fill="#C0392B"/>
  <text x="862" y="686" font-size="10" font-weight="600" fill="#C0392B">Incompleta · 3 sin verificar</text>

  <!-- Nota de accesibilidad -->
  <line x1="40" y1="726" x2="1060" y2="726" stroke="#E2E6EB" stroke-width="1"/>
  <text x="40" y="752" font-size="11" font-weight="600" fill="#1A1D21">Criterio transversal</text>
  <text x="40" y="772" font-size="10.5" fill="#6B7684">El color nunca es el único portador del estado: cada variante lleva texto que lo nombra. Un operador que no distingue rojo de ámbar lee</text>
  <text x="40" y="788" font-size="10.5" fill="#6B7684">igual «SIN RESPUESTA» o «Ejecución NO verificada», y el borde punteado distingue un dato congelado de uno vigente sin depender del tono.</text>
  <text x="40" y="814" font-size="10.5" fill="#6B7684">El estado «deshabilitado» siempre va acompañado del motivo, porque un botón gris sin explicación obliga al operador a adivinar.</text>
</svg>
