<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="360" height="800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fondo atenuado -->
  <rect width="360" height="800" fill="#F7F8FA"/>
  <rect width="360" height="56" fill="#1F3A5F"/>
  <text x="20" y="34" font-size="15" font-weight="600" fill="#FFFFFF">G1-01 · Control</text>
  <rect width="360" height="800" fill="#1A1D21" fill-opacity="0.55"/>

  <!-- Dialogo -->
  <rect x="24" y="250" width="312" height="280" rx="16" fill="#FFFFFF"/>
  <rect x="24" y="250" width="312" height="6" rx="3" fill="#B26B00"/>

  <text x="44" y="288" font-size="16" font-weight="700" fill="#1A1D21">Cancelar la ronda</text>
  <text x="44" y="314" font-size="9.5" font-weight="600" fill="#8A949E" letter-spacing="0.6">PASO 2 DE 2</text>

  <rect x="44" y="326" width="272" height="96" rx="10" fill="#FFF4E0"/>
  <text x="58" y="350" font-size="11.5" font-weight="600" fill="#8A5200">Esto no es lo mismo que regresar.</text>
  <text x="58" y="371" font-size="11" fill="#8A5200">La ronda queda cerrada como incompleta y los 3</text>
  <text x="58" y="388" font-size="11" fill="#8A5200">puntos sin verificar se registran como tales.</text>
  <text x="58" y="409" font-size="11" font-weight="600" fill="#8A5200">La cuadrilla no va a poder ingresar.</text>

  <!-- Acciones -->
  <rect x="44" y="440" width="128" height="44" rx="10" fill="#FFFFFF" stroke="#C6CED6" stroke-width="1.5"/>
  <text x="108" y="467" font-size="12.5" font-weight="600" fill="#1A1D21" text-anchor="middle">Volver</text>
  <rect x="188" y="440" width="128" height="44" rx="10" fill="#C0392B"/>
  <text x="252" y="467" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Cancelar ronda</text>

  <text x="44" y="510" font-size="10" fill="#8A949E">La acción destructiva nunca queda en la posición del</text>
  <text x="44" y="522" font-size="10" fill="#8A949E">botón por defecto.</text>
</svg>
