<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="360" height="800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fondo atenuado -->
  <rect width="360" height="800" fill="#F7F8FA"/>
  <rect width="360" height="56" fill="#1F3A5F"/>
  <text x="20" y="34" font-size="15" font-weight="600" fill="#FFFFFF">G1-01 · Misión</text>
  <rect width="360" height="800" fill="#1A1D21" fill-opacity="0.55"/>

  <!-- Dialogo -->
  <rect x="24" y="214" width="312" height="340" rx="16" fill="#FFFFFF"/>
  <rect x="24" y="214" width="312" height="6" rx="3" fill="#C0392B"/>

  <text x="44" y="252" font-size="16" font-weight="700" fill="#1A1D21">Autorización de supervisor</text>
  <text x="44" y="276" font-size="11.5" fill="#6B7684">Accionar el seccionador de P1 es una orden crítica</text>
  <text x="44" y="293" font-size="11.5" fill="#6B7684">sobre infraestructura eléctrica.</text>

  <text x="44" y="324" font-size="9.5" font-weight="600" fill="#8A949E" letter-spacing="0.6">CÓDIGO DE SUPERVISOR</text>

  <!-- Campo de codigo: estado normal -->
  <rect x="44" y="334" width="56" height="54" rx="10" fill="#FFFFFF" stroke="#0B63CE" stroke-width="2"/>
  <circle cx="72" cy="361" r="5" fill="#1A1D21"/>
  <rect x="110" y="334" width="56" height="54" rx="10" fill="#FFFFFF" stroke="#C6CED6" stroke-width="1.5"/>
  <circle cx="138" cy="361" r="5" fill="#1A1D21"/>
  <rect x="176" y="334" width="56" height="54" rx="10" fill="#FFFFFF" stroke="#C6CED6" stroke-width="1.5"/>
  <circle cx="204" cy="361" r="5" fill="#1A1D21"/>
  <rect x="242" y="334" width="56" height="54" rx="10" fill="#FFFFFF" stroke="#C6CED6" stroke-width="1.5"/>
  <line x1="270" y1="350" x2="270" y2="372" stroke="#0B63CE" stroke-width="2"/>

  <text x="44" y="412" font-size="10.5" fill="#6B7684">La autorización vale 120 s desde su ingreso.</text>
  <text x="44" y="429" font-size="10.5" fill="#6B7684">Queda registrada a nombre de quien la otorgó.</text>

  <!-- Acciones -->
  <rect x="44" y="448" width="128" height="44" rx="10" fill="#FFFFFF" stroke="#C6CED6" stroke-width="1.5"/>
  <text x="108" y="475" font-size="12.5" font-weight="600" fill="#1A1D21" text-anchor="middle">Cancelar</text>
  <rect x="188" y="448" width="128" height="44" rx="10" fill="#0B63CE"/>
  <text x="252" y="475" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Autorizar</text>

  <line x1="44" y1="512" x2="316" y2="512" stroke="#E2E6EB" stroke-width="1"/>
  <text x="44" y="532" font-size="10" fill="#8A949E">Autorizar no acciona nada todavía: después hay una</text>
  <text x="44" y="546" font-size="10" fill="#8A949E">confirmación de dos pasos.</text>
</svg>
