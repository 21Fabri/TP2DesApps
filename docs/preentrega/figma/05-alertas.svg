<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="360" height="800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="360" height="800" fill="#F7F8FA"/>

  <!-- App bar -->
  <rect width="360" height="56" fill="#1F3A5F"/>
  <text x="20" y="34" font-size="15" font-weight="600" fill="#FFFFFF">G1-01 · Alertas e historial</text>

  <!-- Pestanias -->
  <rect x="0" y="56" width="360" height="44" fill="#FFFFFF"/>
  <line x1="0" y1="100" x2="360" y2="100" stroke="#E2E6EB" stroke-width="1"/>
  <text x="90" y="84" font-size="13" font-weight="600" fill="#0B63CE" text-anchor="middle">Alertas (2)</text>
  <rect x="40" y="97" width="100" height="3" fill="#0B63CE"/>
  <text x="270" y="84" font-size="13" fill="#8A949E" text-anchor="middle">Historial</text>

  <!-- Alerta critica -->
  <rect x="16" y="114" width="328" height="100" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
  <rect x="32" y="128" width="58" height="19" rx="9.5" fill="#C0392B"/>
  <text x="61" y="141" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CRÍTICA</text>
  <text x="300" y="141" font-size="10" fill="#A5392B" text-anchor="end">hace 8 s</text>
  <text x="32" y="166" font-size="12.5" font-weight="700" fill="#1A1D21">La detención no se verificó</text>
  <text x="32" y="184" font-size="10.5" fill="#A5392B">Orden confirmada, pero el robot sigue a 1,2 m/s.</text>
  <rect x="32" y="192" width="104" height="26" rx="8" fill="#C0392B"/>
  <text x="84" y="209" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Reconocer</text>
  <text x="148" y="209" font-size="10" fill="#A5392B">Avisar al acompañante</text>

  <!-- Alerta advertencia -->
  <rect x="16" y="226" width="328" height="92" rx="10" fill="#FFF4E0" stroke="#E6B566" stroke-width="1.5"/>
  <rect x="32" y="240" width="88" height="19" rx="9.5" fill="#B26B00"/>
  <text x="76" y="253" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">ADVERTENCIA</text>
  <text x="300" y="253" font-size="10" fill="#8A5200" text-anchor="end">hace 3 min</text>
  <text x="32" y="278" font-size="12.5" font-weight="600" fill="#1A1D21">Temperatura 78,4 °C en P1</text>
  <text x="32" y="295" font-size="10.5" fill="#8A5200">Umbral 70 °C · punto marcado como FALLA</text>
  <rect x="32" y="300" width="104" height="26" rx="8" fill="#FFFFFF" stroke="#B26B00" stroke-width="1.5"/>
  <text x="84" y="317" font-size="11" font-weight="600" fill="#B26B00" text-anchor="middle">Reconocer</text>

  <!-- Alerta informativa ya reconocida -->
  <rect x="16" y="338" width="328" height="78" rx="10" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"/>
  <rect x="32" y="352" width="46" height="19" rx="9.5" fill="#EEF1F4"/>
  <text x="55" y="365" font-size="9.5" font-weight="700" fill="#6B7684" text-anchor="middle">INFO</text>
  <text x="300" y="365" font-size="10" fill="#8A949E" text-anchor="end">14:31</text>
  <text x="32" y="390" font-size="12.5" font-weight="600" fill="#6B7684">Enlace restablecido</text>
  <text x="32" y="407" font-size="10.5" fill="#2F6B48">Reconocida por el operador a las 14:31</text>

  <!-- Nota de criterio -->
  <rect x="16" y="436" width="328" height="78" rx="10" fill="#EEF1F4"/>
  <text x="32" y="460" font-size="11" font-weight="600" fill="#5F6B76">Reconocer no es resolver</text>
  <text x="32" y="479" font-size="10.5" fill="#6B7684">Reconocer sólo registra que el operador vio la alerta.</text>
  <text x="32" y="496" font-size="10.5" fill="#6B7684">La condición que la generó sigue vigente hasta que se</text>
  <text x="32" y="507" font-size="10.5" fill="#6B7684">corrija en el punto.</text>

  <!-- Indicador de registro: HRI -->
  <rect x="16" y="530" width="328" height="62" rx="10" fill="#F4F0FA" stroke="#C7BBE4" stroke-width="1.5"/>
  <circle cx="36" cy="552" r="5" fill="#8A76C4"/>
  <text x="52" y="556" font-size="11" font-weight="600" fill="#4A3A7A">Registrando: lidar y posición</text>
  <text x="32" y="576" font-size="10.5" fill="#5F4F8A">Audio no se persiste · presencias se cuentan sin identificar</text>

  <!-- Barra de navegacion -->
  <rect x="0" y="740" width="360" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="740" x2="360" y2="740" stroke="#E2E6EB" stroke-width="1"/>
  <rect x="228" y="740" width="48" height="3" fill="#0B63CE"/>
  <circle cx="36" cy="762" r="7" fill="none" stroke="#8A949E" stroke-width="2"/>
  <text x="36" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Supervisión</text>
  <rect x="101" y="756" width="14" height="12" rx="2" fill="none" stroke="#8A949E" stroke-width="2"/>
  <text x="108" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Misión</text>
  <circle cx="180" cy="762" r="7" fill="none" stroke="#8A949E" stroke-width="2"/>
  <circle cx="180" cy="762" r="2.5" fill="#8A949E"/>
  <text x="180" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Control</text>
  <path d="M 252 755 L 259 768 L 245 768 Z" fill="none" stroke="#0B63CE" stroke-width="2" stroke-linejoin="round"/>
  <text x="252" y="786" font-size="9" font-weight="600" fill="#0B63CE" text-anchor="middle">Alertas</text>
  <path d="M 320 755 L 330 762 L 320 769 Z" fill="none" stroke="#8A949E" stroke-width="2" stroke-linejoin="round"/>
  <text x="324" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Demo</text>
</svg>
