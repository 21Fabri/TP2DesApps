<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="360" height="800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="360" height="800" fill="#F7F8FA"/>

  <!-- App bar -->
  <rect width="360" height="56" fill="#1F3A5F"/>
  <text x="20" y="34" font-size="15" font-weight="600" fill="#FFFFFF">G1-01 · Supervisión</text>

  <!-- Indicador de antiguedad del dato: estado error -->
  <rect x="0" y="56" width="360" height="46" fill="#FDECEA"/>
  <line x1="0" y1="102" x2="360" y2="102" stroke="#E0A49C" stroke-width="1.5"/>
  <circle cx="24" cy="73" r="4" fill="#C0392B"/>
  <text x="36" y="77" font-size="11.5" font-weight="700" fill="#C0392B">ENLACE PERDIDO · dato de hace 47 s</text>
  <text x="36" y="93" font-size="10.5" fill="#A5392B">Lo que ves abajo es la última lectura, no el presente</text>

  <!-- Estado operativo congelado -->
  <rect x="16" y="114" width="328" height="86" rx="12" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"
        stroke-dasharray="5 4"/>
  <text x="32" y="136" font-size="9.5" font-weight="600" fill="#AAB2BB" letter-spacing="0.6">ESTADO OPERATIVO (CONGELADO)</text>
  <rect x="32" y="146" width="112" height="26" rx="13" fill="#EEF1F4"/>
  <text x="88" y="163" font-size="11.5" font-weight="700" fill="#8A949E" text-anchor="middle">EN TRASLADO</text>
  <text x="32" y="189" font-size="12" fill="#AAB2BB">Última posición conocida: Sala de tablero general</text>

  <!-- Progreso congelado -->
  <rect x="16" y="210" width="328" height="76" rx="12" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"
        stroke-dasharray="5 4"/>
  <text x="32" y="232" font-size="9.5" font-weight="600" fill="#AAB2BB" letter-spacing="0.6">RONDA DE VERIFICACIÓN</text>
  <rect x="32" y="244" width="296" height="8" rx="4" fill="#EEF1F4"/>
  <rect x="32" y="244" width="59" height="8" rx="4" fill="#C6CED6"/>
  <text x="32" y="274" font-size="11.5" fill="#AAB2BB">1 de 5 puntos · el robot sigue trabajando sin enlace</text>

  <!-- Bateria congelada, enlace al dia -->
  <rect x="16" y="296" width="328" height="78" rx="12" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"
        stroke-dasharray="5 4"/>
  <text x="32" y="318" font-size="9.5" font-weight="600" fill="#AAB2BB" letter-spacing="0.6">BATERÍA (CONGELADA)</text>
  <text x="32" y="344" font-size="19" font-weight="700" fill="#AAB2BB">84 %</text>
  <text x="32" y="363" font-size="10.5" fill="#AAB2BB">valor de hace 47 s</text>
  <line x1="186" y1="310" x2="186" y2="360" stroke="#E2E6EB" stroke-width="1"/>
  <text x="204" y="318" font-size="9.5" font-weight="600" fill="#8A949E" letter-spacing="0.6">ENLACE</text>
  <text x="204" y="344" font-size="19" font-weight="700" fill="#C0392B">PERDIDO</text>
  <text x="204" y="363" font-size="10.5" fill="#6B7684">medido por la app</text>

  <!-- Banner de orden sin respuesta -->
  <rect x="16" y="384" width="328" height="74" rx="10" fill="#FDECEA" stroke="#E0A49C" stroke-width="1.5"/>
  <text x="32" y="408" font-size="12" font-weight="700" fill="#A5392B">Detención operativa: SIN RESPUESTA</text>
  <text x="32" y="426" font-size="10.5" fill="#A5392B">Enviada hace 12 s, sin acuse del robot.</text>
  <text x="32" y="444" font-size="10.5" fill="#A5392B">No se reintenta sola. Avisar al acompañante presencial.</text>

  <!-- Regreso autonomo -->
  <rect x="16" y="470" width="328" height="58" rx="10" fill="#FFF4E0" stroke="#E6B566" stroke-width="1.5"/>
  <text x="32" y="494" font-size="12" font-weight="600" fill="#8A5200">Regreso autónomo en 13 s</text>
  <text x="32" y="512" font-size="10.5" fill="#B26B00">Sin enlace por más de 20 s el robot vuelve al punto seguro</text>

  <!-- Telemetria del servicio, congelada -->
  <text x="20" y="556" font-size="9.5" font-weight="600" fill="#AAB2BB" letter-spacing="0.6">TELEMETRÍA DEL SERVICIO (CONGELADA)</text>

  <rect x="16" y="566" width="328" height="62" rx="12" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"
        stroke-dasharray="5 4"/>
  <text x="32" y="588" font-size="9.5" font-weight="600" fill="#AAB2BB" letter-spacing="0.6">TEMPERATURA MÁXIMA</text>
  <text x="32" y="613" font-size="18" font-weight="700" fill="#AAB2BB">38,5 °C</text>

  <rect x="16" y="638" width="328" height="62" rx="12" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"
        stroke-dasharray="5 4"/>
  <text x="32" y="660" font-size="9.5" font-weight="600" fill="#AAB2BB" letter-spacing="0.6">COBERTURA DEL ENTORNO</text>
  <text x="32" y="685" font-size="18" font-weight="700" fill="#AAB2BB">71 %</text>
  <text x="104" y="685" font-size="12.5" fill="#AAB2BB">0 presencias</text>

  <text x="20" y="726" font-size="10.5" fill="#C0392B">Los eventos generados sin enlace llegarán al historial al reconectar</text>

  <!-- Barra de navegacion -->
  <rect x="0" y="740" width="360" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="740" x2="360" y2="740" stroke="#E2E6EB" stroke-width="1"/>
  <rect x="12" y="740" width="48" height="3" fill="#0B63CE"/>
  <circle cx="36" cy="762" r="7" fill="none" stroke="#0B63CE" stroke-width="2"/>
  <text x="36" y="786" font-size="9" font-weight="600" fill="#0B63CE" text-anchor="middle">Supervisión</text>
  <rect x="101" y="756" width="14" height="12" rx="2" fill="none" stroke="#8A949E" stroke-width="2"/>
  <text x="108" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Misión</text>
  <circle cx="180" cy="762" r="7" fill="none" stroke="#8A949E" stroke-width="2"/>
  <circle cx="180" cy="762" r="2.5" fill="#8A949E"/>
  <text x="180" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Control</text>
  <path d="M 252 755 L 259 768 L 245 768 Z" fill="none" stroke="#8A949E" stroke-width="2" stroke-linejoin="round"/>
  <text x="252" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Alertas</text>
  <path d="M 320 755 L 330 762 L 320 769 Z" fill="none" stroke="#8A949E" stroke-width="2" stroke-linejoin="round"/>
  <text x="324" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Demo</text>
</svg>
