<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="360" height="800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="360" height="800" fill="#F7F8FA"/>

  <!-- App bar -->
  <rect width="360" height="56" fill="#1F3A5F"/>
  <text x="20" y="34" font-size="15" font-weight="600" fill="#FFFFFF">Modo demo</text>

  <!-- Aviso: herramienta de prueba -->
  <rect x="16" y="72" width="328" height="64" rx="10" fill="#F4F0FA" stroke="#8A76C4" stroke-width="1.5"/>
  <text x="32" y="96" font-size="12" font-weight="700" fill="#4A3A7A">Herramienta de prueba</text>
  <text x="32" y="114" font-size="10.5" fill="#5F4F8A">Esta pantalla no existiría en la app entregada a un</text>
  <text x="32" y="130" font-size="10.5" fill="#5F4F8A">cliente. Sirve para reproducir cada escenario a voluntad.</text>

  <text x="20" y="162" font-size="9.5" font-weight="600" fill="#8A949E" letter-spacing="0.6">ESCENARIOS</text>

  <rect x="16" y="170" width="328" height="50" rx="10" fill="#FFFFFF" stroke="#C6CED6" stroke-width="1.5"/>
  <circle cx="38" cy="195" r="11" fill="#E8F4EC"/>
  <text x="38" y="199" font-size="11" font-weight="700" fill="#2F6B48" text-anchor="middle">1</text>
  <text x="60" y="191" font-size="12.5" font-weight="600" fill="#1A1D21">Misión normal</text>
  <text x="60" y="208" font-size="10" fill="#6B7684">Ronda completa, 5 puntos OK, regreso a la base</text>

  <rect x="16" y="228" width="328" height="50" rx="10" fill="#FFFFFF" stroke="#C6CED6" stroke-width="1.5"/>
  <circle cx="38" cy="253" r="11" fill="#FFF4E0"/>
  <text x="38" y="257" font-size="11" font-weight="700" fill="#B26B00" text-anchor="middle">2</text>
  <text x="60" y="249" font-size="12.5" font-weight="600" fill="#1A1D21">Batería baja</text>
  <text x="60" y="266" font-size="10" fill="#6B7684">La opción de continuar se deshabilita sola</text>

  <rect x="16" y="286" width="328" height="50" rx="10" fill="#FFFFFF" stroke="#C6CED6" stroke-width="1.5"/>
  <circle cx="38" cy="311" r="11" fill="#FDECEA"/>
  <text x="38" y="315" font-size="11" font-weight="700" fill="#C0392B" text-anchor="middle">3</text>
  <text x="60" y="307" font-size="12.5" font-weight="600" fill="#1A1D21">Desconexión</text>
  <text x="60" y="324" font-size="10" fill="#6B7684">Dato antiguo, orden sin respuesta y reconciliación</text>

  <rect x="16" y="344" width="328" height="50" rx="10" fill="#FFFFFF" stroke="#C6CED6" stroke-width="1.5"/>
  <circle cx="38" cy="369" r="11" fill="#FDECEA"/>
  <text x="38" y="373" font-size="11" font-weight="700" fill="#C0392B" text-anchor="middle">4</text>
  <text x="60" y="365" font-size="12.5" font-weight="600" fill="#1A1D21">Incidente en P1</text>
  <text x="60" y="382" font-size="10" fill="#6B7684">78,4 °C, subproceso de anomalía y autorización</text>

  <rect x="16" y="402" width="328" height="50" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <circle cx="38" cy="427" r="11" fill="#C0392B"/>
  <text x="38" y="431" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="60" y="423" font-size="12.5" font-weight="700" fill="#C0392B">Orden confirmada que no se ejecuta</text>
  <text x="60" y="440" font-size="10" fill="#A5392B">Escenario propio del grupo</text>

  <text x="20" y="480" font-size="9.5" font-weight="600" fill="#8A949E" letter-spacing="0.6">INYECCIÓN DE FALLAS SUELTAS</text>

  <rect x="16" y="488" width="328" height="46" rx="10" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"/>
  <text x="32" y="516" font-size="12" fill="#1A1D21">Forzar pérdida de enlace</text>
  <rect x="286" y="500" width="42" height="22" rx="11" fill="#0B63CE"/>
  <circle cx="317" cy="511" r="8.5" fill="#FFFFFF"/>

  <rect x="16" y="542" width="328" height="46" rx="10" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"/>
  <text x="32" y="570" font-size="12" fill="#1A1D21">Forzar presencia a 1,8 m</text>
  <rect x="286" y="554" width="42" height="22" rx="11" fill="#C6CED6"/>
  <circle cx="297" cy="565" r="8.5" fill="#FFFFFF"/>

  <rect x="16" y="596" width="328" height="46" rx="10" fill="#FFFFFF" stroke="#E2E6EB" stroke-width="1.5"/>
  <text x="32" y="624" font-size="12" fill="#1A1D21">Forzar batería al 40 %</text>
  <rect x="286" y="608" width="42" height="22" rx="11" fill="#C6CED6"/>
  <circle cx="297" cy="619" r="8.5" fill="#FFFFFF"/>

  <rect x="16" y="662" width="328" height="46" rx="10" fill="#FFFFFF" stroke="#C6CED6" stroke-width="1.5"/>
  <text x="180" y="690" font-size="12.5" font-weight="600" fill="#1A1D21" text-anchor="middle">Reiniciar simulación e historial</text>

  <!-- Barra de navegacion -->
  <rect x="0" y="740" width="360" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="740" x2="360" y2="740" stroke="#E2E6EB" stroke-width="1"/>
  <rect x="300" y="740" width="48" height="3" fill="#0B63CE"/>
  <circle cx="36" cy="762" r="7" fill="none" stroke="#8A949E" stroke-width="2"/>
  <text x="36" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Supervisión</text>
  <rect x="101" y="756" width="14" height="12" rx="2" fill="none" stroke="#8A949E" stroke-width="2"/>
  <text x="108" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Misión</text>
  <circle cx="180" cy="762" r="7" fill="none" stroke="#8A949E" stroke-width="2"/>
  <circle cx="180" cy="762" r="2.5" fill="#8A949E"/>
  <text x="180" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Control</text>
  <path d="M 252 755 L 259 768 L 245 768 Z" fill="none" stroke="#8A949E" stroke-width="2" stroke-linejoin="round"/>
  <text x="252" y="786" font-size="9" fill="#8A949E" text-anchor="middle">Alertas</text>
  <path d="M 320 755 L 330 762 L 320 769 Z" fill="none" stroke="#0B63CE" stroke-width="2" stroke-linejoin="round"/>
  <text x="324" y="786" font-size="9" font-weight="600" fill="#0B63CE" text-anchor="middle">Demo</text>
</svg>
